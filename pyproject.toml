[build-system]
requires = ["maturin>=1.8,<2"]
build-backend = "maturin"

[project]
name = "hailrs"
version = "0.1.0"
description = "Spark-free native Hail readers with selective S3 and GCS access"
readme = "README.md"
requires-python = ">=3.10,<3.14"
license = "MIT"
license-files = ["LICENSE", "src/reference/LICENSE"]
dependencies = ["numpy>=1.24", "pyarrow>=14"]

[project.optional-dependencies]
test = ["pytest>=8"]

[dependency-groups]
dev = ["maturin>=1.8,<2", "pytest>=8"]

[tool.uv]
managed = true

[tool.maturin]
features = ["extension-module"]
python-source = "python"
module-name = "hailrs._native"
