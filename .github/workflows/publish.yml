name: Python distributions

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish tested distributions to PyPI (requires a Trusted Publisher)
        type: boolean
        default: false
      version:
        description: Exact package version to build
        type: string
        required: true
        default: "0.1.0"

permissions:
  contents: read

concurrency:
  group: python-release-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  wheels:
    name: ${{ matrix.platform }} / Python ${{ matrix.python }}
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13"]
        platform: [linux-x86_64, linux-aarch64, macos-arm64, macos-x86_64]
        include:
          - platform: linux-x86_64
            os: ubuntu-24.04
            target: x86_64
          - platform: linux-aarch64
            os: ubuntu-24.04-arm
            target: aarch64
          - platform: macos-arm64
            os: macos-15
            target: aarch64
          - platform: macos-x86_64
            os: macos-15-intel
            target: x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - name: Check release version
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          python -c "import os; from pathlib import Path; text = Path('pyproject.toml').read_text(); assert '\nversion = \"' + os.environ['RELEASE_VERSION'] + '\"\n' in text"
      - uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1
        with:
          target: ${{ matrix.target }}
          manylinux: "2_28"
          args: --release --locked --out dist --interpreter python${{ matrix.python }}
        env:
          MACOSX_DEPLOYMENT_TARGET: "11.0"
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          prune-cache: true
      - name: Test installed wheel
        run: |
          uv venv --python "${{ matrix.python }}" .release-venv
          uv pip install --python .release-venv/bin/python dist/*.whl pytest
          .release-venv/bin/python -m pytest -q tests/test_fixtures.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          archive: true
          name: wheel-${{ matrix.platform }}-py${{ matrix.python }}
          path: dist/*.whl
          if-no-files-found: error

  sdist:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          prune-cache: true
      - uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1
        with:
          command: sdist
          args: --out dist
      - name: Build and test source distribution
        run: |
          uv venv --python 3.12 .release-venv
          uv pip install --python .release-venv/bin/python dist/*.tar.gz pytest
          .release-venv/bin/python -m pytest -q tests/test_fixtures.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          archive: true
          name: sdist
          path: dist/*.tar.gz
          if-no-files-found: error

  publish:
    if: inputs.publish && github.ref == 'refs/heads/main'
    needs: [wheels, sdist]
    runs-on: ubuntu-24.04
    environment:
      name: pypi
      url: https://pypi.org/project/hailrs/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1
