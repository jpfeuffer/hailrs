name: Python distributions

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish tested distributions to PyPI (requires a Trusted Publisher)
        type: boolean
        default: false
      version:
        description: Exact package version to build
        type: string
        required: true
        default: "0.1.0"

permissions:
  contents: read

concurrency:
  group: python-release-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  wheels:
    name: ${{ matrix.platform }} / Python ${{ matrix.python }}
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13"]
        platform: [linux-x86_64, linux-aarch64, macos-arm64, macos-x86_64]
        include:
          - platform: linux-x86_64
            os: ubuntu-24.04
            target: x86_64
          - platform: linux-aarch64
            os: ubuntu-24.04-arm
            target: aarch64
          - platform: macos-arm64
            os: macos-15
            target: aarch64
          - platform: macos-x86_64
            os: macos-15-intel
            target: x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - name: Check release version
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          python -c "import os; from pathlib import Path; text = Path('pyproject.toml').read_text(); assert '\nversion = \"' + os.environ['RELEASE_VERSION'] + '\"\n' in text"
      - uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1
        with:
          target: ${{ matrix.target }}
          manylinux: "2_28"
          args: --release --locked --out dist --interpreter python${{ matrix.python }}
        env:
          MACOSX_DEPLOYMENT_TARGET: "11.0"
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
      - name: Test installed wheel
        run: |
          uv venv --python "${{ matrix.python }}" .release-venv
          uv pip install --python .release-venv/bin/python dist/*.whl pytest
          .release-venv/bin/python -m pytest -q tests/test_fixtures.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: wheel-${{ matrix.platform }}-py${{ matrix.python }}
          path: dist/*.whl
          if-no-files-found: error

  sdist:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
      - uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1
        with:
          command: sdist
          args: --out dist
      - name: Build and test source distribution
        run: |
          uv venv --python 3.12 .release-venv
          uv pip install --python .release-venv/bin/python dist/*.tar.gz pytest
          .release-venv/bin/python -m pytest -q tests/test_fixtures.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sdist
          path: dist/*.tar.gz
          if-no-files-found: error

  publish:
    if: inputs.publish && github.ref == 'refs/heads/main'
    needs: [wheels, sdist]
    runs-on: ubuntu-24.04
    environment:
      name: pypi
      url: https://pypi.org/project/hailrs/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1
